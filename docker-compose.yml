services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
    volumes:
      - tabsa-data:/app/server/data
    ports:
      - "4000:4000" # Changed from 127.0.0.1:4000:4000 to allow bridge networking

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /home/tabsa/Caddyfile.local:/etc/caddy/Caddyfile:ro # Changed to your actual file path
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  tabsa-data:
  caddy-data:
  caddy-config:
