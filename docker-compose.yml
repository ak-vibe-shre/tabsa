services:
  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    network_mode: host
    environment:
      NODE_ENV: production
      PORT: 4000
    volumes:
      - tabsa-data:/app/server/data

  caddy:
    build:
      context: .
      dockerfile: caddy/Dockerfile
    restart: unless-stopped
    network_mode: host
    depends_on:
      - backend

volumes:
  tabsa-data:
