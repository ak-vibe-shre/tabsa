# Local-dev override — NOT auto-loaded (renamed from docker-compose.override.yml
# specifically so `docker compose up` on the real server can never pick it up
# by accident and rebind nginx to loopback-only).
#
# Usage locally (the --env-file remaps nginx off ports 80/443 entirely, so it
# never collides with anything already using those ports on your machine):
#   docker compose --env-file .env.local -f docker-compose.yml -f docker-compose.local.yml up -d --build
#
# On the real server, just: docker compose up -d --build
services:
  nginx:
    volumes:
      - ./nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
